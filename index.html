<!DOCTYPE html>
<html>
<head>
  <title>GoogleSheet Data Entry Form</title>
  <style>
    
  </style>
</head>
<body>
  <h1>Data Entry Form</h1>
  <form id="dataForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" required><br><br>
    <label for="cellNumber">Cell Number:</label>
    <input type="tel" id="cellNumber" name="cellNumber" required><br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required><br><br>
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById('dataForm');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const name = document.getElementById('name').value;
  const address = document.getElementById('address').value;
  const cellNumber = document.getElementById('cellNumber').value;
  const age = document.getElementById('age').value;

  try {
    const response = await fetch('https://script.google.com/macros/s/1rqjWzug5qJaTRSl5t0O_MteSs_rAjL_EbTe9a2FAIsft6YSZBYnzEE9g', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ name, address, cellNumber, age })
    });

    if (!response.ok) {
      throw new Error('Network response was not ok');
    }

    const data = await response.json();
    if (data.status === 'success') {
      alert('Data submitted successfully!');
    } else {
      alert('Error submitting data: ' + data.message);
    }

  } catch (error) {
    console.error('There has been a problem with your fetch operation:', error);
    alert('An error occurred while submitting data.');
  }
});
    function doPost(e) {
  const data = JSON.parse(e.postData.getDataAsString());

  // Get the active spreadsheet
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sheet = ss.getSheetByName('Sheet1'); // Replace 'Sheet1' with your sheet name

  // Append data to the sheet
  sheet.appendRow([data.name, data.address, data.cellNumber, data.age]);

  return ContentService.createTextOutput(JSON.stringify({ status: 'success' }))
      .setMimeType(ContentService.MimeType.JSON);
}
  </script>
</body>
</html>
